[package]
name = "rocket-include-static-resources"
version = "0.11.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/magiclen/rocket-include-static-resources"
homepage = "https://magiclen.org/rocket-include-static-resources"
keywords = ["rocket", "server", "web", "static", "file"]
categories = ["web-programming"]
description = "This is a crate which provides macros `static_resources_initializer!` and `static_response_handler!` to statically include files from your Rust project and make them be the HTTP response sources quickly."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
rocket = "0.5"
mime = "0.3.4"
mime_guess = "2"
manifest-dir-macros = { version = "0.1.9", features = ["tuple", "mime_guess"] }

rocket-etag-if-none-match = "0.5"
# `EntityTag` comes from `rocket-etag-if-none-match`, which does not enable `weak-hasher` itself. This direct dependency turns that feature on through feature unification, so it has to keep resolving to the very same version of `entity-tag` that `rocket-etag-if-none-match` depends on.
entity-tag = { version = "0.2", features = ["weak-hasher"] }

rocket-cache-response = { version = "0.7", optional = true }

[features]
cache = ["dep:rocket-cache-response"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]